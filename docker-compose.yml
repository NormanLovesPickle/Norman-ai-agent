services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norman-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_AI_DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - SEARCH_API_API_KEY=${SEARCH_API_API_KEY}
      - SERVER_PORT=8123
      - JAVA_OPTS=-Xmx700m -Xms256m
    volumes:
      - ./logs:/app/logs
    networks:
      - norman-net

  frontend:
    build:
      context: ./norman-ai-agent-frontend
      dockerfile: Dockerfile
    container_name: norman-frontend
    restart: always
    networks:
      - norman-net

  nginx:
    image: nginx:alpine
    container_name: norman-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - norman-net

networks:
  norman-net:
